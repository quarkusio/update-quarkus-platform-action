name: 'Update Quarkus Platform GitHub Action'
description: 'Updates Quarkus Platform members'
inputs:
  github-token:
    description: 'GitHub token'
    required: true
  packages-token:
    description: 'Token used to download the action artifact from GitHub Packages'
    required: true
  action:
    description: 'Name of the action (if named)'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '25'
        set-default: false
    - name: Inject quarkus-github-action repository credentials
      shell: bash
      run: |
        if [ -f ~/.m2/settings.xml ]; then
          if ! grep -q '<id>quarkus-github-action</id>' ~/.m2/settings.xml; then
            yq -p xml -o xml -i '.settings.servers.server |= (. | [.] + [{"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.PACKAGES_TOKEN}"}])' ~/.m2/settings.xml
          fi
        else
          mkdir -p ~/.m2/
          yq -p xml -o xml -n '.settings.servers.server = {"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.PACKAGES_TOKEN}"}' > ~/.m2/settings.xml
        fi
    - name: Set up JBang
      uses: jbangdev/setup-jbang@main
    - name: Run the action
      id: action
      run: |
        if [[ -n "${JAVA_HOME_25_X64}" ]]; then
          echo "Installing ${JAVA_HOME_25_X64} as JDK 25 for JBang"
          jbang --verbose jdk install java-25 ${JAVA_HOME_25_X64}
        fi
        jbang --java 25 --fresh --repos 'quarkus-github-action=https://maven.pkg.github.com/quarkusio/update-quarkus-platform-action/' --repos 'mavencentral' io.quarkus.automation:update-quarkus-platform-action:999-SNAPSHOT
      shell: bash
      env:
        JSON_INPUTS: ${{ toJSON(inputs) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
